name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  TZ: "America/Argentina/Buenos_Aires" # Esto establece el entorno a GMT-3

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test
